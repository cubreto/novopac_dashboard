# NovoPAC Dashboard Docker Compose Configuration
# 
# CRITICAL CONNECTION INFO:
# =========================
# PostgreSQL: novopac-pg:5432 (internal) / localhost:5435 (external)
# Dashboard: localhost:8507
# 
# ENVIRONMENT VARIABLES:
# =====================
# NOVOPAC_ENV=production: Forces dashboard to use Docker network connection
# DATABASE_URL: Full connection string for dashboard container
#
services:
  # ---------- PostgreSQL Database ----------
  novopac-pg:
    image: postgres:15-alpine
    container_name: novopac-pg
    ports:
      - "5435:5432"  # External:Internal port mapping for ETL access
    environment:
      POSTGRES_DB: novopac_db
      POSTGRES_USER: novopac_user
      POSTGRES_PASSWORD: novopac_pass
    volumes:
      - pgdata_novopac:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novopac_user -d novopac_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - novopac-network

  # ---------- NovoPAC Dashboard ----------
  novopac-dashboard:
    build: .
    container_name: novopac-dashboard
    depends_on:
      novopac-pg:
        condition: service_healthy
    ports:
      - "8507:8507"
    environment:
      # PostgreSQL connection details (for reference/debugging)
      PGHOST: novopac-pg
      PGPORT: 5432
      PGDATABASE: novopac_db
      PGUSER: novopac_user
      PGPASSWORD: novopac_pass
      
      # CRITICAL: Environment mode (forces production config)
      NOVOPAC_ENV: production
      
      # CRITICAL: Full database URL for dashboard container
      # This is what the dashboard actually uses to connect
      DATABASE_URL: postgresql+psycopg://novopac_user:novopac_pass@novopac-pg:5432/novopac_db
    volumes:
      - .:/app
    command: >
      streamlit run streamlit_app/novopac_dashboard.py
      --server.port 8507
      --server.address 0.0.0.0
      --server.headless true
      --server.fileWatcherType none
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - novopac-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8507/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ---------- Shared Resources ----------
volumes:
  pgdata_novopac:

networks:
  novopac-network:
    driver: bridge

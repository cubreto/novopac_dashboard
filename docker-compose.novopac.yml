services:
  # ---------- PostgreSQL (5435) ----------
  novopac-pg:
    image: postgres:15-alpine
    container_name: novopac-pg
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: novopac_db
      POSTGRES_USER: novopac_user
      POSTGRES_PASSWORD: novopac_pass
    volumes:
      - pgdata_novopac:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novopac_user -d novopac_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - novopac-network

